name: Release APK

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest

    permissions:
      contents: write

    env:
      SHHH_VERSION_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}

    steps:
      - name: Validate release tag format
        run: |
          if [[ ! "${SHHH_VERSION_TAG}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "::error::Release tag '${SHHH_VERSION_TAG}' must follow semver format vX.Y.Z."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests & Android Lint
        run: ./gradlew test lintDebug --stacktrace

      - name: Restore release signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.SHHH_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.SHHH_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SHHH_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SHHH_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Missing required release signing secrets (SHHH_KEYSTORE_BASE64, SHHH_KEYSTORE_PASSWORD, SHHH_KEY_ALIAS, SHHH_KEY_PASSWORD)."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > shhh-release.jks
          if [ ! -s shhh-release.jks ]; then
            echo "::error::Decoded shhh-release.jks is empty."
            exit 1
          fi

      - name: Build Release APK
        env:
          SHHH_REQUIRE_RELEASE_SIGNING: "true"
          SHHH_KEYSTORE_FILE: shhh-release.jks
          SHHH_KEYSTORE_PASSWORD: ${{ secrets.SHHH_KEYSTORE_PASSWORD }}
          SHHH_KEY_ALIAS: ${{ secrets.SHHH_KEY_ALIAS }}
          SHHH_KEY_PASSWORD: ${{ secrets.SHHH_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Verify APK version and release signature
        run: |
          python3 - <<'PY'
          import json, os, sys
          with open("app/build/outputs/apk/release/output-metadata.json") as f:
              meta = json.load(f)
          expected = os.environ["SHHH_VERSION_TAG"].removeprefix("v")
          actual = meta["elements"][0]["versionName"]
          code = meta["elements"][0]["versionCode"]
          print(f"Release APK versionName={actual}, versionCode={code}")
          if actual != expected:
              print(f"::error::Built APK versionName '{actual}' != expected '{expected}'", file=sys.stderr)
              sys.exit(1)
          PY
          APKSIGNER=$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" -name apksigner | sort -V | tail -n 1)
          if [ -z "$APKSIGNER" ]; then
            echo "::error::apksigner not found in Android SDK build-tools."
            exit 1
          fi
          CERTS=$("$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk)
          echo "$CERTS"
          if echo "$CERTS" | grep -q "CN=Android Debug"; then
            echo "::error::Release APK must not be signed with the Android Debug certificate."
            exit 1
          fi

      - name: Clean up release keystore
        if: always()
        run: rm -f shhh-release.jks

      - name: Rename release APK
        run: mv app/build/outputs/apk/release/app-release.apk "app/build/outputs/apk/release/shhh-${GITHUB_REF_NAME}-release.apk"

      - name: Upload APK to Release
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
