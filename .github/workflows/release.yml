name: Release APK

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests & Android Lint
        run: ./gradlew test lintDebug --stacktrace

      - name: Restore release signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.SHHH_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::Release signing secrets not configured; falling back to debug signing."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > shhh-release.jks

      - name: Build Release APK
        env:
          SHHH_KEYSTORE_FILE: shhh-release.jks
          SHHH_KEYSTORE_PASSWORD: ${{ secrets.SHHH_KEYSTORE_PASSWORD }}
          SHHH_KEY_ALIAS: ${{ secrets.SHHH_KEY_ALIAS }}
          SHHH_KEY_PASSWORD: ${{ secrets.SHHH_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Rename release APK
        run: mv app/build/outputs/apk/release/app-release.apk "app/build/outputs/apk/release/shhh-${GITHUB_REF_NAME}-release.apk"

      - name: Upload APK to Release
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
